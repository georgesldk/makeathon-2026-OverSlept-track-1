services:
  - type: web
    name: ethnotrace-api
    runtime: python
    rootDir: Makeathon_UI
    buildCommand: pip install -r requirements.txt
    startCommand: python -B server.py
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USER
        sync: false
      - key: NEO4J_PASSWORD
        sync: false
      - key: NEO4J_DATABASE
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
